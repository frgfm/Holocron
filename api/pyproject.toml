[project]
name = "holocron"
version = "0.3.1.dev0"
description = "Backend template for your Vision API with Holocron"
requires-python = ">=3.11,<4.0"
license = { text = "Apache-2.0" }
authors = [{ name = "François-Guillaume Fernandez", email = "fg-feedback@protonmail.com" }]
maintainers = [{ name = "François-Guillaume Fernandez", email = "fg-feedback@protonmail.com" }]
readme = "README.md"
keywords = ["backend", "api", "computer vision", "fastapi", "onnx"]
dependencies = [
    "fastapi>=0.143.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "python-multipart>=0.0.27,<1.0.0",
    # Security floor: https://github.com/advisories/GHSA-65qm-jvmh-6pqg
    "Pillow>=13.0.0",
    "onnxruntime>=1.31.0,<2.0.0",
    "huggingface-hub>=1.0.0,<2.0.0",
    "numpy>=1.19.5,<3.0.0",
    # Transitive dependencies
    # Security floor: https://github.com/advisories/GHSA-6q48-6c7w-9gw2
    "certifi>=2026.10.19"
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pytest-cov==7.1.0",
    "pytest-pretty==1.3.0",
    "requests>=2.33.0,<3.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/"]
addopts = "--cov=app"
