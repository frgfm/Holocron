<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Holocron image classification demo</title>
  </head>
  <body>
    <main>
      <h1>Holocron image classification</h1>
      <p>Choose a JPEG or PNG image to see the three most likely classes.</p>
      <form id="form">
        <label for="image">Image</label>
        <input id="image" name="file" type="file" accept="image/jpeg,image/png" required>
        <button type="submit">Classify image</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <ol id="results" aria-label="Top predictions"></ol>
    </main>
    <script>
      const form = document.querySelector("#form");
      const image = document.querySelector("#image");
      const status = document.querySelector("#status");
      const results = document.querySelector("#results");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        results.replaceChildren();
        status.textContent = "Classifying…";
        const body = new FormData();
        body.append("file", image.files[0]);
        try {
          const response = await fetch("/predictions", { method: "POST", body });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || "The image could not be classified.");
          for (const item of data) {
            const row = document.createElement("li");
            row.textContent = `${item.name}: ${(item.confidence * 100).toFixed(2)}%`;
            results.append(row);
          }
          status.textContent = "Done.";
        } catch (error) {
          status.textContent = error.message || "The image could not be classified.";
        }
      });
    </script>
  </body>
</html>
