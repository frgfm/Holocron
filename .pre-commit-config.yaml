default_language_version:
    python: python3.11
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        exclude: docs/mkdocs.yml
      - id: debug-statements
        language_version: python3
      - id: end-of-file-fixer
      - id: no-commit-to-branch
        args: ['--branch', 'main']
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 'v4.2.0'
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject
        args: ["./pyproject.toml", "./api/pyproject.toml"]
  - repo: local
    hooks:
      - id: lint-format
        name: Fix lint and format code
        entry: make lint-format
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
      - id: lmh
        name: Lint My Headers
        entry: make headers-check
        language: system
        pass_filenames: false
      - id: deps-check
        name: check deps version sync
        entry: make deps-check
        language: system
        pass_filenames: false
      - id: typing-check
        name: check typing
        entry: make typing-check
        language: system
        pass_filenames: false
