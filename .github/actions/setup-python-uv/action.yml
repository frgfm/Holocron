name: Set up Python and uv
description: Install the shared CI Python and uv toolchain

inputs:
  python-version:
    description: Python version, overridden by compatibility matrices
    default: '3.11'
  architecture:
    description: Python architecture, overridden for native Core ML tests
    default: x64
  activate-environment:
    description: Activate a project virtual environment
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}
        architecture: ${{ inputs.architecture }}
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: '0.13.4'
        activate-environment: ${{ inputs.activate-environment }}
