# Batch routine version updates weekly across all ecosystems.
# Security updates are alert-driven and do not follow this schedule.
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates

version: 2
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
  - package-ecosystem: "uv"
    directories: ["/", "/api"]
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
  - package-ecosystem: "docker"
    directory: "/api"
    patterns: ["*"]
    multi-ecosystem-group: "weekly-dependencies"
