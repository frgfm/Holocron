# Schedule updates for the selected development and API dependencies.
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "ci(github)"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      quality:
        patterns:
          - "ruff"
          - "ty"
          - "prek"
      docs:
        patterns:
          - "mkdocs"
          - "mkdocs-material*"
          - "mkdocstrings*"
          - "griffe-typingdoc"
      tests:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "pytest-pretty"
      pytorch:
        patterns:
          - "torch"
          - "torchvision"
  - package-ecosystem: "uv"
    directory: "/api"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Paris"
    groups:
      runtime:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/demo"
    labels:
      - "dependencies"
      - "type: misc"
    commit-message:
      prefix: "build(deps)"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Paris"
