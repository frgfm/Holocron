name: scripts

on:
  push:
    branches: main
    paths:
      - '.github/workflows/scripts.yml'
      - '.github/actions/setup-python-uv/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/scripts.yml'
      - '.github/actions/setup-python-uv/**'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read


jobs:
  eval-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
      - name: Run script
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make install-scripts
          make bench-latency LATENCY_ARGS="--it 5 --warmup 1 --repeat 1 --output latency.json"
          make bench-latency LATENCY_ARGS="--backend onnx --it 5 --warmup 1 --repeat 1 --output latency-onnx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: latency
          path: latency*.json
