name: scripts

on:
  push:
    branches: main
    paths:
      - '.github/workflows/scripts.yml'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/scripts.yml'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"

jobs:
  eval-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
      - name: Run script
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make install-scripts
          make bench-latency LATENCY_ARGS="--it 5 --warmup 1 --repeat 1 --output latency.json"
          make bench-latency LATENCY_ARGS="--backend onnx --it 5 --warmup 1 --repeat 1 --output latency-onnx.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: latency
          path: latency*.json
