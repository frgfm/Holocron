name: scripts

on:
  push:
    branches: main
    paths:
      - '.github/workflows/scripts.yml'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/scripts.yml'
      - 'scripts/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"

jobs:
  eval-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
      - name: Run script
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make install-scripts
          make bench-latency LATENCY_ARGS="--it 5 --warmup 1 --repeat 1 --output latency.json"
          make bench-latency LATENCY_ARGS="--backend onnx --it 5 --warmup 1 --repeat 1 --output latency-onnx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: latency
          path: latency*.json
