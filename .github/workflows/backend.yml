name: backend

on:
  push:
    branches: main
    paths:
      - '.github/workflows/backend.yml'
      - '.github/actions/setup-python-uv/**'
      - 'api/**'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/backend.yml'
      - '.github/actions/setup-python-uv/**'
      - 'api/**'
  release:
    types: [published]

permissions:
  contents: read

env:
  DOCKER_PLATFORM: "linux/amd64"

jobs:
  uvicorn:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('api/uv.lock') }}
      - name: Install backend
        run: |
          make install-backend
      - name: Run uvicorn
        run: |
          screen -dm make uvicorn-backend
          sleep 10
          curl -f http://localhost:8080/health --max-time 3

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-backend-${{ hashFiles('api/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-${{ hashFiles('api/uv.lock') }}-
            ${{ runner.os }}-buildx-backend-
            ${{ runner.os }}-buildx-
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_SUMMARY: true
        with:
          push: false
          load: true
          context: ./api
          tags: |
            ${{ github.event.repository.name }}-backend:latest
          platforms: ${{ env.DOCKER_PLATFORM }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
      # Temp fix for https://github.com/docker/build-push-action/issues/252
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          activate-environment: 'false'
      - name: Run docker test
        run: |
          make install-backend-test
          make test-backend

  ghcr:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      packages: write
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Generate metadata
        id: meta
        run: |
          echo "date=$(date -u +"%Y-%m-%dT%H-%M-%S")" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(grep -E '^version = ' api/pyproject.toml | sed 's/version = "\(.*\)"/\1/')" >> $GITHUB_OUTPUT
      - name: Docker meta
        id: labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}-backend
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-backend-${{ hashFiles('api/uv.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-${{ hashFiles('api/uv.lock') }}-
            ${{ runner.os }}-buildx-backend-
            ${{ runner.os }}-buildx-
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_SUMMARY: true
        with:
          push: true
          context: ./api
          platforms: ${{ env.DOCKER_PLATFORM }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          tags: |
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:${{ steps.meta.outputs.date }}
            ghcr.io/${{ github.repository }}-backend:${{ steps.meta.outputs.commit }}
            ghcr.io/${{ github.repository }}-backend:${{ steps.meta.outputs.version }}
          labels: ${{ steps.labels.outputs.labels }}
          annotations: ${{ steps.labels.outputs.annotations }}
      # Temp fix for https://github.com/docker/build-push-action/issues/252
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        continue-on-error: true
        with:
          subject-name: ghcr.io/${{ github.repository }}-backend
          subject-digest: ${{ steps.build.outputs.digest }}
