name: security-dependencies

on:
  pull_request:
    branches: main
    paths:
      - '.github/workflows/security-dependencies.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'api/pyproject.toml'
      - 'api/uv.lock'
      - 'api/Dockerfile'
      - 'demo/requirements.txt'
      - 'demo/app.py'
  push:
    branches: main
    paths:
      - '.github/workflows/security-dependencies.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'api/pyproject.toml'
      - 'api/uv.lock'
      - 'api/Dockerfile'
      - 'demo/requirements.txt'
      - 'demo/app.py'
  schedule:
    - cron: '0 8 * * 1'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.4'
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Check dependency manifest sync
        run: make deps-check
      - name: Audit resolved library dependencies
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/library.txt"
          pip-audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/library.txt"
      - name: Audit resolved API dependencies
        run: |
          uv export --project api --locked --all-extras --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file "$RUNNER_TEMP/api.txt"
          pip-audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/api.txt"
      - name: Audit demo dependencies
        run: |
          uv pip compile demo/requirements.txt --python-version 3.11 --no-header --quiet --output-file "$RUNNER_TEMP/demo.txt"
          pip-audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/demo.txt"

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --pull --tag holocron-api:security ./api
      - name: Scan API image packages and CA bundle
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: holocron-api:security
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
