name: demo

on:
  push:
    branches: main
    paths:
      - '.github/workflows/demo.yml'
      - 'demo/**'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/demo.yml'
      - 'demo/**'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
      - name: Run demo app
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make install-demo
          make run-demo > "$RUNNER_TEMP/demo.log" 2>&1 &
          demo_pid=$!
          trap 'cat "$RUNNER_TEMP/demo.log"; kill "$demo_pid" 2>/dev/null || true' EXIT
          timeout 60 sh -c 'until curl --fail --silent http://127.0.0.1:3000/health; do sleep 1; done'
