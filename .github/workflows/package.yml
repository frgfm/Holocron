name: package

on:
  push:
    branches: main
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/coreml.yml'
      - 'holocron/**'
      - 'tests/**'
      - 'scripts/export_to_onnx.py'
      - 'scripts/export_to_coreml.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/package.yml'
      - '.github/workflows/coreml.yml'
      - 'holocron/**'
      - 'tests/**'
      - 'scripts/export_to_onnx.py'
      - 'scripts/export_to_coreml.py'
      - 'pyproject.toml'
      - 'uv.lock'
  release:
    types: [published]

concurrency:
  group: package-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"
  PYTHON_VERSION: "3.11"


jobs:
  install:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
        exclude:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
      - name: Build the package
        run: make build
      - name: Install the engine
        env:
          UV_TORCH_BACKEND: cpu
        run: make install
      - name: Check that we can import the engine
        run: |
          python -c "import holocron; print(holocron.__version__)"

  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          activate-environment: true
      - name: Run tests
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          UV_TORCH_BACKEND='cpu' make install-test
          UV_TORCH_BACKEND='cpu' make test
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          files: ./coverage.xml
          fail_ci_if_error: true

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    outputs:
      package_version: ${{ steps.set_version.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set package version
        id: set_version
        run: |
          RELEASE_TAG=${{ github.ref_name }}
          # Strip "v" prefix
          BUILD_VERSION=${RELEASE_TAG#v}
          # Replace SemVer pre-release separators with PEP440 compatible ones
          BUILD_VERSION=${BUILD_VERSION//-alpha./a}
          BUILD_VERSION=${BUILD_VERSION//-beta./b}
          BUILD_VERSION=${BUILD_VERSION//-rc./rc}
          echo "package_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
      - name: Publish to PyPI
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make set-version
          make build && make publish

  verify-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
        exclude:
          - os: windows-latest
            python: '3.13'
    needs: publish
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install package
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          uv pip install --system pylocron==${{ needs.publish.outputs.package_version }}
          python -c "import holocron; print(holocron.__version__)"
