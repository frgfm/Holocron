name: package

on:
  push:
    branches: main
    paths:
      - '.github/workflows/package.yml'
      - '.github/actions/setup-python-uv/**'
      - '.github/workflows/coreml.yml'
      - 'holocron/**'
      - 'tests/**'
      - 'scripts/export_to_onnx.py'
      - 'scripts/export_to_coreml.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: main
    paths:
      - '.github/workflows/package.yml'
      - '.github/actions/setup-python-uv/**'
      - '.github/workflows/coreml.yml'
      - 'holocron/**'
      - 'tests/**'
      - 'scripts/export_to_onnx.py'
      - 'scripts/export_to_coreml.py'
      - 'pyproject.toml'
      - 'uv.lock'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true



jobs:
  install:
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
        exclude:
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python }}
      - name: Build the package
        run: make build
      - name: Install the engine
        env:
          UV_TORCH_BACKEND: cpu
        run: make install
      - name: Check that we can import the engine
        run: |
          python -c "import holocron; print(holocron.__version__)"

  test:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
      - name: Run tests
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          UV_TORCH_BACKEND='cpu' make install-test
          UV_TORCH_BACKEND='cpu' make test
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          files: ./coverage.xml
          fail_ci_if_error: true

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For PyPI's trusted publishing.
      id-token: write
    outputs:
      package_version: ${{ steps.set_version.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          activate-environment: 'false'
      - name: Set package version
        id: set_version
        run: |
          RELEASE_TAG=${{ github.ref_name }}
          # Strip "v" prefix
          BUILD_VERSION=${RELEASE_TAG#v}
          # Replace SemVer pre-release separators with PEP440 compatible ones
          BUILD_VERSION=${BUILD_VERSION//-alpha./a}
          BUILD_VERSION=${BUILD_VERSION//-beta./b}
          BUILD_VERSION=${BUILD_VERSION//-rc./rc}
          echo "package_version=${BUILD_VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_ENV
      - name: Publish to PyPI
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          make set-version
          make build && make publish

  verify-publish:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
        exclude:
          - os: windows-latest
            python: '3.13'
    needs: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python }}
          activate-environment: 'false'
      - name: Install package
        working-directory: ${{ runner.temp }}
        env:
          UV_TORCH_BACKEND: cpu
        run: |
          uv pip install --system pylocron==${{ needs.publish.outputs.package_version }}
          python -c "import holocron; print(holocron.__version__)"
